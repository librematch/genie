[workspace]
# Format crates (GPL-3.0, imported from genie-rs) inherit [workspace.package] below.
# Engine crates (AGPL-3.0) set their own licence, edition and authors; engine crates may depend on
# format crates, never the reverse (a GPL crate must not pull in AGPL code).
# Tool crates (AGPL-3.0, crates/tools/) follow the engine crates' rules and may depend on both.
# Base crates (GPL-3.0, crates/base/) depend on no crate of the workspace but each other; every
# crate may depend on them (genie-error, the error every crate returns; genie-diff, the field by
# field comparison, with its derive).
resolver = "2"
members = [
  "crates/base/genie-diff",
  "crates/base/genie-diff-derive",
  "crates/base/genie-error",
  "crates/formats/genie-formats",
  "crates/formats/genie-cpx",
  "crates/formats/genie-dat",
  "crates/formats/genie-drs",
  "crates/formats/genie-hki",
  "crates/formats/genie-json",
  "crates/formats/genie-lang",
  "crates/formats/genie-rec",
  "crates/formats/genie-save",
  "crates/formats/genie-scx",
  "crates/formats/genie-support",
  "crates/formats/jascpal",
  "crates/engine/genie-command-codec",
  "crates/engine/genie-core",
  "crates/engine/genie-math",
  "crates/engine/genie-model",
  "crates/engine/genie-import",
  "crates/engine/genie-nickel",
  "crates/tools/genie-oracle",
  "crates/tools/genie-swiss-knife",
]

[workspace.package]
authors = ["Libre:Match Authors <info@librematch.org>"]
edition = "2024"
rust-version = "1.99.0"
license = "AGPL-3.0-only"
repository = "https://github.com/librematch/genie"

[workspace.dependencies]
structopt = "0.3.26"
simplelog = "0.12.0"
byteorder = "1.4.3"
flate2 = { version = "1.0.24", features = [
  "rust_backend",
], default-features = false }
encoding_rs = "0.8.31"
encoding_rs_io = "0.1.7"
rgb = "0.8.34"
num_enum = "0.7"
arrayvec = "0.7.2"
# Without the default `verbose-backtrace` feature: error paths stay lean.
binrw = { version = "0.15", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# the model types' JSON Schema, which genie-nickel writes as Nickel contracts (FD-046-D15)
schemars = "1.2"
# the model's schema hash, a part of the model cache's key (FD-046-D18)
sha2 = "0.10"
postcard = { version = "1", default-features = false, features = ["use-std"] }
indexmap = { version = "2", features = ["serde"] }
rayon = "1"
# the engine's spans and events (genie-core::trace); without the proc-macro attributes
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# the binaries' subscribers for them (gsk, genie-oracle's examples); each adds its formatter
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "registry", "std"] }
# the getters of the engine's newtypes, whose values only their checked constructors set
getset = "0.1.7"
# the engine's bit sets (C-BITFLAG, FD-043): named bits, the bit operators and their formats
bitflags = "2.13"
# the derives of the std traits whose impl is the plain one (T16, the user, 2026-11-04):
# derive_more for the newtypes and the enums' formats, strum for the enums' names and values
derive_more = { version = "2.1", features = ["add", "add_assign", "display", "not"] }
strum = { version = "0.28", features = ["derive"] }

# see: https://nnethercote.github.io/perf-book/build-configuration.html
[profile.dev]
opt-level = 0
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 4

# compile dependencies with optimizations in dev mode
# see: https://doc.rust-lang.org/stable/cargo/reference/profiles.html#overrides
[profile.dev.package."*"]
opt-level = 3
debug = true

[profile.release]
opt-level = 3
debug = false # true for profiling
rpath = false
lto = "fat"
debug-assertions = false
codegen-units = 1
strip = true
panic = "abort"

# the forced replay's loop (`just forced`): release code, built fast (thin LTO, parallel codegen,
# incremental) and with the line tables a profiler needs; never for a release
[profile.forced]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"
strip = false

[profile.test]
opt-level = 1
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 4

[profile.bench]
opt-level = 3
debug = true # true for profiling
rpath = false
lto = true
debug-assertions = false
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
bad_style = { level = "warn", priority = -1 }
trivial_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
dead_code = "warn"
improper_ctypes = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_shorthand_field_patterns = "warn"
overflowing_literals = "warn"
path_statements = "warn"
patterns_in_fns_without_body = "warn"
trivial_numeric_casts = "warn"
unused_results = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unconditional_recursion = "warn"
unused = { level = "warn", priority = -1 }
unused_allocation = "warn"
unused_comparisons = "warn"
unused_parens = "warn"
while_true = "warn"
unreachable_pub = "allow"

[workspace.lints.clippy]
redundant_pub_crate = "allow"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# expect_used = "warn" # TODO Error handling!
# unwrap_used = "warn" # TODO Error handling!
# a hash map's iteration order is not the game's (CODING_STYLE.md section 12)
iter_over_hash_type = "warn"
enum_glob_use = "warn"
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
cast_lossless = "warn"
default_trait_access = "warn"
doc_markdown = "warn"
manual_string_new = "warn"
match_same_arms = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
module_name_repetitions = "allow"
# C-CASE (CODING_STYLE.md section 3): an acronym is one word in a type's or variant's name
upper_case_acronyms = "warn"
# an item comes in with a `use` of its path from the crate root, never by its whole path
absolute_paths = "deny"
# K9: every variable, parameter, field and item has a speaking name (clippy.toml allows the
# coordinates)
min_ident_chars = "warn"

[workspace.lints.rustdoc]
# We run rustdoc with `--document-private-items` so we can document private items
private_intra_doc_links = "allow"
