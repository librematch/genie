name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Every crate is warning-free under the workspace lints (root Cargo.toml); a generated file
      # carries its generator's own allow list.
      - name: Clippy (whole workspace, warnings are errors)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  file-size:
    name: No hand-written file above its production lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # scripts/file_size.py (the runner's Python 3, 3.11 or later): at most
      # .config/file-size.toml's threshold of production lines per hand-written file, unless
      # .config/file-size-debt.json holds the file at that length.
      - run: python3 -I -m unittest discover -s scripts -p 'test_*.py'
      - run: scripts/file_size.py
      # scripts/lint_allows.py: no lint turned off where it was not before (.config/lint-allows.json,
      # FD-043's section L)
      - run: scripts/lint_allows.py
      # scripts/c_case.py: every name follows RFC 430 (CODING_STYLE.md section 3, C-CASE)
      - run: scripts/c_case.py
      # scripts/module_paths.py: no function is reached through an imported module of genie's
      # (CODING_STYLE.md section 4, FD-043-D37)
      - run: scripts/module_paths.py

  contracts:
    name: The model's Nickel contracts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # contracts/genie.ncl, written from genie-model's types by genie-nickel's contracts binary
      # (FD-046-D15); `just contracts` regenerates it
      - run: cargo run --locked -q -p genie-nickel --bin contracts -- --check

  readmes:
    name: Every genie-core folder has a current README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # scripts/readmes.py (the runner's Python 3, 3.11 or later): each folder's README.md holds
      # its prose and the generated tables of its files and of the systems it uses, current
      # with the code (docs/ENGINE_SYSTEMS.md). Its tests run in the file-size job.
      - run: scripts/readmes.py crates/engine/genie-core/src --check
      # scripts/effects.py: docs/EFFECTS.md, the inventory of what an object's update hands on
      # (the world's outputs, the unit AI's effects, the hand-offs; FD-045), current with the code
      - run: scripts/effects.py crates/engine/genie-core/src --check
      # scripts/schedule.py: docs/ENGINE_SYSTEMS.md's table of the update's steps, current with
      # genie-core's world/schedule.rs (FD-045-D13)
      - run: scripts/schedule.py crates/engine/genie-core/src --check

  dependencies:
    name: Format crates do not depend on engine or tool crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The format crates are GPL and must stay usable without the AGPL engine and tool crates.
      - run: |
          cargo metadata --locked --format-version 1 --no-deps | jq -e -r '
            [.packages[] | select(.manifest_path | contains("/crates/engine/") or contains("/crates/tools/")) | .name] as $engine
            | [.packages[] | select(.manifest_path | contains("/crates/formats/"))
               | .name as $crate | .dependencies[] | select(.name | IN($engine[]))
               | "\($crate) depends on \(.name)"]
            | if length == 0 then "ok" else (.[] | halt_error) end'

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  wasm:
    name: Build engine for wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The engine core must stay compilable to WebAssembly. Add every new engine crate here; a
      # crate with features builds in a step of its own below (`--no-default-features` applies
      # to every package of one build, FD-046-D19).
      - run: cargo build --locked -p genie-error -p genie-diff -p genie-math -p genie-model -p genie-core -p genie-command-codec --target wasm32-unknown-unknown
      # the importers and the oracle in their browser form: no file system, the bytes passed in
      - run: cargo build --locked -p genie-import --no-default-features --features wasm --target wasm32-unknown-unknown
      - run: cargo build --locked -p genie-oracle --no-default-features --features wasm --target wasm32-unknown-unknown
      # Nickel's evaluator, which the build layer and the mods run in the browser too (FD-046-D13)
      - run: cargo build --locked -p genie-nickel --target wasm32-unknown-unknown

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # every intra-doc link resolves, the private items' too
      - run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
