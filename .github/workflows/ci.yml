name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The engine crates must be warning-free. Add every new engine crate here.
      - name: Clippy (engine crates, warnings are errors)
        run: cargo clippy --locked --no-deps -p genie-core -p genie-oracle --all-targets -- -D warnings
      # The format crates imported from genie-rs still carry warnings; they are reported only.
      - name: Clippy (whole workspace, report only)
        run: cargo clippy --locked --workspace --all-targets

  dependencies:
    name: Format crates do not depend on engine crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The format crates are GPL and must stay usable without the AGPL engine.
      - run: |
          cargo metadata --locked --format-version 1 --no-deps | jq -e -r '
            [.packages[] | select(.manifest_path | contains("/crates/engine/")) | .name] as $engine
            | [.packages[] | select(.manifest_path | contains("/crates/formats/"))
               | .name as $crate | .dependencies[] | select(.name | IN($engine[]))
               | "\($crate) depends on \(.name)"]
            | if length == 0 then "ok" else (.[] | halt_error) end'

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  wasm:
    name: Build engine for wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The engine core must stay compilable to WebAssembly. Add every new engine crate here;
      # genie-oracle, a host-side test harness, is exempt.
      - run: cargo build --locked -p genie-core --target wasm32-unknown-unknown

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --workspace --no-deps
