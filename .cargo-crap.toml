# cargo-crap (`scripts/crap.sh`): every function's CRAP score, its cyclomatic complexity
# against its line coverage by the workspace's own tests (cargo-llvm-cov over nextest). Above
# the threshold a function is a risk to change: give it tests, or split it into named
# functions (a closure's branches count nowhere, so moving them into one only hides them).
threshold = 30

# The generated sources (their generators carry the clippy allow lists too) and the test
# modules kept in files of their own.
exclude = [
    "src/generated/**",
    "src/de/command/generated.rs",
    "src/los_tables.rs",
    "src/unit_ai/logged_kinds.rs",
    "src/image.rs",
    "src/**/tests.rs",
]

# Enable duplicates scanning
[duplicates]
enabled = true
