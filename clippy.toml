# Tests may unwrap, expect and panic; production code of a crate that turns the panic lints
# on (CODING_STYLE.md, sections 7 and 14) may not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# C-CASE (CODING_STYLE.md section 3): an acronym is one word in every type and variant name,
# not only in one that is all capitals.
upper-case-acronyms-aggressive = true
# K9 (CODING_STYLE.md section 3): a name of one letter only for a coordinate or an axis
# (`Axis::X`); `min_ident_chars` (Cargo.toml) refuses every other.
allowed-idents-below-min-chars = ["x", "y", "z", "X", "Y"]
# CODING_STYLE.md section 12: std's hash containers order their entries by a seed each process
# picks at random. The simulation holds none: a lookup by a dense id is a column, any other map
# a `BTreeMap` or a list.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "its order differs in every process (CODING_STYLE.md section 12): a column by id, a `BTreeMap` or a list" },
    { path = "std::collections::HashSet", reason = "its order differs in every process (CODING_STYLE.md section 12): a column by id, a `BTreeSet` or a list" },
]
