[package]
name = "genie-oracle"
version = "0.1.0"
description = "Checks the genie engine against Age of Empires II: Definitive Edition recorded games"
edition = "2024"
license = "AGPL-3.0-only"
repository.workspace = true
publish = false

[dependencies]
# the field by field comparison of genie's objects with the game's (FD-045-D14)
genie-diff = { path = "../../base/genie-diff" }
genie-command-codec = { path = "../../engine/genie-command-codec" }
genie-core = { path = "../../engine/genie-core" }
genie-dat = { version = "0.1.0", path = "../../formats/genie-dat" }
# the .dat, save and table importers (FD-046-D26)
genie-import = { path = "../../engine/genie-import" }
# the build layer from its Nickel source (FD-046-D08)
genie-nickel = { path = "../../engine/genie-nickel" }
# the build layer's type
genie-model = { path = "../../engine/genie-model" }
genie-json = { version = "0.1.0", path = "../../formats/genie-json" }
genie-rec = { version = "0.1.1", path = "../../formats/genie-rec" }
genie-save = { version = "0.1.0", path = "../../formats/genie-save" }
flate2.workspace = true
rayon.workspace = true
serde_json.workspace = true

[dev-dependencies]
# the subscriber of the examples that run the engine (examples/support/mod.rs): text lines on
# stderr, with RUST_LOG set
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true
