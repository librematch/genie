[package]
name = "genie-swiss-knife"
version = "0.0.0"
description = "gsk, the genie swiss knife: one command-line tool for the files of the Genie engine (Age of Empires II). Nothing is implemented yet."
edition = "2024"
rust-version.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["aoe2", "age-of-empires", "genie", "cli"]
categories = ["command-line-utilities", "parser-implementations"]

[[bin]]
name = "gsk"
path = "src/bin/gsk/main.rs"

[dependencies]
abscissa_core = "0.9.0"
clap = "4"
# the error's format, derived (T16)
derive_more.workspace = true
serde.workspace = true
thiserror.workspace = true
# the subscriber for the engine's spans and events (src/subscriber.rs): bunyan JSON lines, with
# RUST_LOG set
tracing.workspace = true
tracing-bunyan-formatter = { version = "0.3", default-features = false }
tracing-subscriber.workspace = true

[dev-dependencies]
abscissa_core = { version = "0.9.0", features = ["testing"] }

[lints]
workspace = true
