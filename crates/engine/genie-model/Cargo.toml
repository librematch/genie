[package]
name = "genie-model"
version = "0.1.0"
description = "The game data of Age of Empires II: Definitive Edition as the genie engine holds it: masters, technologies, effects, the tech tree, unit lines, drop sites, graphics, roles, slots and tuning"
edition = "2024"
license = "AGPL-3.0-only"
repository.workspace = true

[dependencies]
# the error every crate returns: its kind, reason, place and context
genie-error = { path = "../../base/genie-error" }
# the field by field comparison the divergence tools run on the state (FD-045-D14)
genie-diff = { path = "../../base/genie-diff" }
# the f32 operations as the game's code does them, the image's constants and the map's geometry
# (FD-046-D28)
genie-math = { path = "../genie-math" }
# the getters of the newtypes: their values are private, so only the constructors that check
# them set them (FD-001-D23)
getset.workspace = true
# the bit sets the game tests bit by bit (a master's flags, the layer's role sets)
bitflags = { workspace = true, features = ["serde"] }
# the build layer's form in Nickel and the model's in the cache (FD-046-D08, D18); `rc` for the
# tables' `Arc`s
serde = { workspace = true, features = ["rc"] }
# the types' JSON Schema, which genie-nickel writes as Nickel contracts (FD-046-D15)
schemars = { workspace = true, optional = true }

[dev-dependencies]
# the role tables' serde form in the tests
serde_json.workspace = true

[features]
# the JSON Schema of the model's types (FD-046-D15)
schema = ["dep:schemars", "genie-math/schema"]

[lints]
workspace = true
