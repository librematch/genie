[package]
name = "genie-math"
version = "0.1.0"
description = "The f32 operations of Age of Empires II: Definitive Edition as its code does them, its image's constants and the map's geometry, for the genie engine"
edition = "2024"
license = "AGPL-3.0-only"
repository.workspace = true

[dependencies]
# the geometry's and the angle's field differences (genie-core's per-object diff, FD-045-D14)
genie-diff = { path = "../../base/genie-diff" }
# the types' serde form: the model's cache (FD-046-D18)
serde.workspace = true
# the types' formats, derived where they are the plain ones (T16)
derive_more.workspace = true
# the types' JSON Schema, which genie-nickel writes as Nickel contracts (FD-046-D15)
schemars = { workspace = true, optional = true }

[features]
# the JSON Schema of the model's types (FD-046-D15)
schema = ["dep:schemars"]

[lints]
workspace = true
