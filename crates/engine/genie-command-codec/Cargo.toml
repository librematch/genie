[package]
name = "genie-command-codec"
version = "0.1.0"
description = "The command packets of Age of Empires II: Definitive Edition recordings as the genie engine's commands, and back"
edition = "2024"
license = "AGPL-3.0-only"
repository.workspace = true
homepage = "https://github.com/librematch/genie/tree/main/crates/engine/genie-command-codec"
documentation = "https://docs.rs/genie-command-codec"
readme = "./README.md"
keywords = ["aoe2", "age-of-empires", "genie", "commands", "replay"]
categories = ["parser-implementations", "game-development"]

[dependencies]
genie-core = { path = "../genie-core" }
genie-rec = { version = "0.2.0", path = "../../formats/genie-rec" }

[lints]
workspace = true
