[package]
name = "genie-core"
version = "0.1.0"
description = "Deterministic simulation core of the genie Age of Empires II: Definitive Edition engine"
edition = "2024"
license = "AGPL-3.0-only"
repository.workspace = true

[dependencies]
# the error every crate returns: its kind, reason, place and context
genie-error = { path = "../../base/genie-error" }
# the field by field comparison the divergence tools run on the state (FD-045-D14)
genie-diff = { path = "../../base/genie-diff" }
# the getters of the newtypes (an object id, a player, a master, a point): their values are
# private, so only the constructors that check them set them (FD-001-D23)
getset.workspace = true
# the f32 operations as the game's code does them, the image's constants and the map's geometry
# (FD-046-D28)
genie-math = { path = "../genie-math" }
# the game data the systems read (FD-046)
genie-model = { path = "../genie-model" }
# the save the world loads from (src/world/load.rs, FD-043-01M6JPBEDA): its records as genie-save
# reads them, and the importers that fill the masters' values the save does not hold
genie-save = { path = "../../formats/genie-save" }
genie-import = { path = "../genie-import", default-features = false }
# the bit sets the game tests bit by bit (the vision's player bits): every bit kept (`_ = !0`)
bitflags.workspace = true
# the formats derived where they are the plain ones (the steps' names, T16)
derive_more.workspace = true
# the enums' names as static strings (the update's steps for the harness's save names)
strum.workspace = true
# floorf, which the game imports from the CRT (api-ms-win-crt-math): an exact operation, so libm's
# gives its bits (src/objects/facing.rs); the image's own math routines are ported in
# src/math/fmath/, and tests/crt_math.rs's ignored sweeps check them against libm
libm = "0.2"
# what the engine tells a subscriber while it runs (src/trace.rs); the binaries install one
tracing.workspace = true

[lints]
workspace = true
