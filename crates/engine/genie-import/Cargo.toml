[package]
name = "genie-import"
version = "0.1.0"
description = "The game's files as the genie engine's model: the .dat's masters, technologies, effects and terrains, a save's masters, the JSON tables beside the .dat, and a cached load from a game install"
edition = "2024"
license = "AGPL-3.0-only"
repository.workspace = true
homepage = "https://github.com/librematch/genie/tree/main/crates/engine/genie-import"
documentation = "https://docs.rs/genie-import"
readme = "./README.md"
keywords = ["aoe2", "age-of-empires", "genie", "game-data"]
categories = ["game-engines", "parser-implementations"]

[dependencies]
# the game data the importers fill (FD-046); its JSON Schema is the cache's layout hash (D60)
genie-model = { path = "../genie-model", features = ["schema"] }
# the f32 operations as the game's code does them and the map's geometry (FD-046-D28)
genie-math = { path = "../genie-math" }
# the error every crate returns: its kind, reason, place and context
genie-error = { path = "../../base/genie-error" }
genie-dat = { version = "0.2.0", path = "../../formats/genie-dat" }
genie-json = { version = "0.1.0", path = "../../formats/genie-json" }
genie-save = { version = "0.1.0", path = "../../formats/genie-save" }
serde_json.workspace = true
# the import's tables in the model's cache (FD-046-D18): their serde form, postcard's bytes
# (D59) and the key's hash
serde.workspace = true
postcard.workspace = true
sha2.workspace = true
schemars.workspace = true

[features]
default = ["fs"]
# the files: the `.dat` and the tables beside it read from their paths, the cache directory
# (FD-046-D19)
fs = []
# the browser build's own parts (D19); the import of bytes needs none, so nothing yet
wasm = []

[lints]
workspace = true

