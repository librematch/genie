[package]
name = "genie-rec"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
description = "Read Age of Empires I/II recorded game files."
homepage = "https://github.com/librematch/genie/tree/main/crates/formats/genie-rec"
documentation = "https://docs.rs/genie-rec"
repository.workspace = true
readme = "./README.md"
keywords = ["aoe2", "age-of-empires", "genie", "recorded-game", "replay"]
categories = ["parser-implementations", "game-development"]

[dependencies]
arrayvec.workspace = true
binrw.workspace = true
byteorder.workspace = true
flate2.workspace = true
genie-dat = { version = "0.1.0", path = "../genie-dat" }
genie-error = { path = "../../base/genie-error" }
genie-save = { version = "0.1.0", path = "../genie-save" }
genie-scx = { version = "4.0.0", path = "../genie-scx" }
genie-support = { version = "1.0.0", path = "../genie-support", features = [
    "strings",
] }
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
