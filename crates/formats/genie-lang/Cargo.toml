[package]
name = "genie-lang"
version = "0.3.0"
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
description = "Read different types of language resource files from Age of Empires 1 and 2."
homepage = "https://github.com/librematch/genie/tree/main/crates/formats/genie-lang"
documentation = "https://docs.rs/genie-lang"
repository.workspace = true
readme = "./README.md"
exclude = ["test/dlls"]
keywords = ["aoe2", "age-of-empires", "genie", "localization"]
categories = ["parser-implementations", "game-development", "localization"]

[dependencies]
genie-error = { path = "../../base/genie-error" }
byteorder.workspace = true
encoding_rs.workspace = true
encoding_rs_io.workspace = true
genie-support = { version = "1.0.0", path = "../genie-support" }
pelite = { version = "0.10.0", default-features = false, features = ["mmap"] }

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
