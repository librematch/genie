[package]
name = "jascpal"
version = "0.1.1"
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
description = "Read and write JASC palette files."
homepage = "https://github.com/librematch/genie/tree/main/crates/formats/jascpal"
documentation = "https://docs.rs/jascpal"
repository.workspace = true
readme = "./README.md"
keywords = ["palette", "jasc", "paint-shop-pro", "color"]
categories = ["parser-implementations", "multimedia::images"]

[dependencies]
genie-error = { path = "../../base/genie-error" }
nom = { version = "7.1.1", default-features = false, features = ["std"] }
rgb.workspace = true
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
