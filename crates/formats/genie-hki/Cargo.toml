[package]
name = "genie-hki"
version = "0.3.0"
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
description = "Read Age of Empires I/II hotkey files."
homepage = "https://github.com/librematch/genie/tree/main/crates/formats/genie-hki"
documentation = "https://docs.rs/genie-hki"
repository.workspace = true
readme = "./README.md"
exclude = ["test/files"]
keywords = ["aoe2", "age-of-empires", "genie", "hotkeys"]
categories = ["parser-implementations", "game-development"]

[dependencies]
genie-error = { path = "../../base/genie-error" }
byteorder.workspace = true
flate2.workspace = true
genie-lang = { version = "0.3.0", path = "../genie-lang" }
genie-support = { version = "1.0.0", path = "../genie-support" }

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
