[package]
name = "genie-cpx"
version = "0.6.0"
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
description = "Read and write Age of Empires I/II campaign files."
homepage = "https://github.com/librematch/genie/tree/main/crates/formats/genie-cpx"
documentation = "https://docs.rs/genie-cpx"
repository.workspace = true
readme = "./README.md"
exclude = ["test/campaigns"]
keywords = ["aoe2", "age-of-empires", "genie", "campaign"]
categories = ["parser-implementations", "game-development"]

[dependencies]
genie-error = { path = "../../base/genie-error" }
byteorder.workspace = true
chardet = "0.2.4"
encoding_rs.workspace = true
genie-scx = { version = "5.0.0", path = "../genie-scx" }
genie-support = { version = "1.0.0", path = "../genie-support" }
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
