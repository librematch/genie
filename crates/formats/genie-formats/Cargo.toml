[package]
name = "genie-formats"
version = "0.5.0"
description = "Readers and writers for Age of Empires II data files (formerly the `genie` crate)"
documentation = "https://docs.rs/genie-formats/"
homepage = "https://github.com/librematch/genie/tree/main/crates/formats/genie-formats"
readme = "../README.md"

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
repository.workspace = true
keywords = ["aoe2", "age-of-empires", "genie", "file-format"]
categories = ["parser-implementations", "game-development"]

[dependencies]
genie-cpx = { version = "0.5.0", path = "../genie-cpx" }
genie-dat = { version = "0.1.0", path = "../genie-dat" }
genie-drs = { version = "0.2.1", path = "../genie-drs" }
genie-hki = { version = "0.2.1", path = "../genie-hki" }
genie-json = { version = "0.1.0", path = "../genie-json" }
genie-lang = { version = "0.2.1", path = "../genie-lang" }
genie-rec = { version = "0.1.1", path = "../genie-rec" }
genie-save = { version = "0.1.0", path = "../genie-save" }
genie-scx = { version = "4.0.0", path = "../genie-scx" }
jascpal = { version = "0.1.1", path = "../jascpal" }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
structopt.workspace = true
anyhow.workspace = true
simplelog.workspace = true

[lints]
workspace = true
