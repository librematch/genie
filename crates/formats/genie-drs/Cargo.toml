[package]
name = "genie-drs"
version = "0.2.1"
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "Read .drs archive files from the Genie Engine, used in Age of Empires 1/2 and SWGB"
homepage = "https://github.com/librematch/genie/tree/main/crates/formats/genie-drs"
documentation = "https://docs.rs/genie-drs"
repository.workspace = true
readme = "./README.md"
exclude = ["*.drs"]
keywords = ["aoe2", "age-of-empires", "genie", "drs", "archive"]
categories = ["parser-implementations", "game-development"]

[dependencies]
genie-error = { path = "../../base/genie-error" }
byteorder.workspace = true
sorted-vec = "0.8.0"

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
