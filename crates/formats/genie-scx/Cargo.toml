[package]
name = "genie-scx"
version = "5.0.0"
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
description = "Read and write Age of Empires I/II scenario files."
homepage = "https://github.com/librematch/genie/tree/main/crates/formats/genie-scx"
documentation = "https://docs.rs/genie-scx"
repository.workspace = true
readme = "./README.md"
exclude = ["test/scenarios"]
keywords = ["aoe2", "age-of-empires", "genie", "scenario"]
categories = ["parser-implementations", "game-development"]

[dependencies]
genie-error = { path = "../../base/genie-error" }
byteorder.workspace = true
flate2.workspace = true
genie-support = { version = "^1.0.0", path = "../genie-support", features = [
    "strings",
] }
log = "0.4.17"
nohash-hasher = "0.2.0"
rgb.workspace = true
thiserror.workspace = true
num_enum.workspace = true

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
